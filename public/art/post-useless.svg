<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#efdfe6"/>
      <stop offset=".42" stop-color="#d8c7d8"/>
      <stop offset=".78" stop-color="#b8aac8"/>
      <stop offset="1" stop-color="#8d809a"/>
    </linearGradient>
    <radialGradient id="peach" cx="30%" cy="25%" r="60%">
      <stop offset="0" stop-color="#ffe9d4" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#ffb9a1" stop-opacity=".4"/>
      <stop offset="1" stop-color="#ff9b83" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="green" cx="80%" cy="70%" r="45%">
      <stop offset="0" stop-color="#d8ff43" stop-opacity=".4"/>
      <stop offset="1" stop-color="#d8ff43" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <ellipse cx="330" cy="340" rx="520" ry="460" fill="url(#peach)" filter="url(#blur)"/>
  <ellipse cx="950" cy="1180" rx="420" ry="380" fill="url(#green)" filter="url(#blur)"/>

  <circle cx="600" cy="680" r="280" fill="none" stroke="#29232b" stroke-width=".8" opacity=".5"/>
  <circle cx="600" cy="680" r="280" fill="none" stroke="#29232b" stroke-width=".8" opacity=".25" stroke-dasharray="1 10" transform="rotate(8 600 680)"/>
  <circle cx="600" cy="680" r="6" fill="#201b21"/>

  <path d="M120 1090 C 400 1010 760 1130 1080 1040" fill="none" stroke="#28222a" stroke-width=".8" opacity=".35"/>

  <g font-family="'JetBrains Mono', Consolas, monospace" fill="#2b242c" opacity=".7">
    <text x="72" y="92" font-size="15" letter-spacing="4">AN EXERCISE IN NOTHING / 无用的练习</text>
    <text x="1128" y="1420" font-size="11" letter-spacing="3" text-anchor="end">FIELD NOTE 05 — 2026</text>
  </g>

  <text x="600" y="1190" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="115" fill="#2b242c" opacity=".8">on uselessness</text>
  <text x="600" y="1245" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="5" fill="#2b242c" opacity=".5">MAKE SOMETHING FOR NO REASON</text>

  <rect width="1200" height="1500" filter="url(#grain)" opacity=".14" style="mix-blend-mode:multiply"/>
</svg>
