<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1c100c"/>
      <stop offset=".45" stop-color="#0c0908"/>
      <stop offset="1" stop-color="#040303"/>
    </linearGradient>
    <radialGradient id="orb" cx="38%" cy="34%" r="65%">
      <stop offset="0" stop-color="#fff6e1"/>
      <stop offset=".32" stop-color="#ffc48c"/>
      <stop offset=".7" stop-color="#e34b1c"/>
      <stop offset="1" stop-color="#4a0e04"/>
    </radialGradient>
    <filter id="warp" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".005 .008" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="70" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <circle cx="820" cy="420" r="300" fill="url(#orb)" opacity=".55" filter="url(#blur)"/>

  <g filter="url(#warp)" stroke="#f7d7b3" fill="none" opacity=".45">
    <path d="M0 160 H1200 M0 300 H1200 M0 440 H1200 M0 580 H1200 M0 720 H1200 M0 860 H1200 M0 1000 H1200 M0 1140 H1200 M0 1280 H1200 M0 1420 H1200" stroke-width=".8"/>
    <path d="M160 0 V1500 M300 0 V1500 M440 0 V1500 M580 0 V1500 M720 0 V1500 M860 0 V1500 M1000 0 V1500 M1140 0 V1500" stroke-width=".5" opacity=".6"/>
  </g>

  <circle cx="780" cy="500" r="250" fill="url(#orb)"/>
  <circle cx="780" cy="500" r="330" fill="none" stroke="#ffd4a8" stroke-width=".8" opacity=".28" stroke-dasharray="2 9"/>
  <ellipse cx="780" cy="500" rx="430" ry="90" fill="none" stroke="#ffdcb6" stroke-width=".7" opacity=".22" transform="rotate(-18 780 500)"/>

  <circle cx="600" cy="1290" r="160" fill="#ff5a2f" opacity=".2" filter="url(#blur)"/>

  <g font-family="'JetBrains Mono', Consolas, monospace" fill="#f6e6d3" opacity=".72">
    <text x="72" y="92" font-size="15" letter-spacing="4">ON GRAVITY / 关于重力</text>
    <text x="1128" y="1420" font-size="11" letter-spacing="3" text-anchor="end">DESIGNING WITH WEIGHT / 2026</text>
  </g>

  <text x="600" y="1180" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="150" fill="#ffe7cf" opacity=".8">gravity</text>

  <rect width="1200" height="1500" filter="url(#grain)" opacity=".16" style="mix-blend-mode:overlay"/>
</svg>
