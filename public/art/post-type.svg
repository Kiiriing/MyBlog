<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2ede2"/>
      <stop offset="1" stop-color="#ddd4c2"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#paper)"/>
  <g stroke="#1c1a15" opacity=".18">
    <path d="M0 300 H1200 M0 450 H1200 M0 600 H1200 M0 750 H1200 M0 900 H1200 M0 1050 H1200 M0 1200 H1200 M0 1350 H1200" stroke-width=".7"/>
    <path d="M200 0 V1500 M400 0 V1500 M600 0 V1500 M800 0 V1500 M1000 0 V1500" stroke-width=".5"/>
  </g>

  <text x="210" y="1030" font-family="Georgia, 'Times New Roman', serif" font-size="820" fill="#14120e">A</text>
  <text x="320" y="1130" font-family="Georgia, serif" font-style="italic" font-size="640" fill="none" stroke="#14120e" stroke-width="2" opacity=".55">a</text>

  <rect x="870" y="230" width="42" height="42" fill="#e0431d"/>
  <circle cx="1000" cy="720" r="8" fill="#14120e"/>

  <g font-family="'JetBrains Mono', Consolas, monospace" fill="#1a1812" opacity=".78">
    <text x="72" y="92" font-size="15" letter-spacing="4">TYPE AS WEATHER / 字体天气</text>
    <text x="1128" y="1420" font-size="11" letter-spacing="3" text-anchor="end">SPECIMEN NO. 03 — 2026</text>
    <text x="72" y="1380" font-size="11" letter-spacing="2" opacity=".55">INSTRUMENT SERIF / 24 PT / 96 PT</text>
  </g>

  <text x="870" y="340" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#1a1812" opacity=".6">A / 01</text>

  <rect width="1200" height="1500" filter="url(#grain)" opacity=".12" style="mix-blend-mode:multiply"/>
</svg>
