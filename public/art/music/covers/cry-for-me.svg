<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="ink" cx="44%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#3a332a" />
      <stop offset="46%" stop-color="#181512" />
      <stop offset="100%" stop-color="#090807" />
    </radialGradient>
    <linearGradient id="chrome" x1="8%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#efe8db" stop-opacity="0" />
      <stop offset="38%" stop-color="#efe8db" stop-opacity="0.30" />
      <stop offset="54%" stop-color="#ff5a2f" stop-opacity="0.34" />
      <stop offset="74%" stop-color="#efe8db" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#efe8db" stop-opacity="0" />
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.22" />
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#ink)" />
  <rect width="600" height="600" fill="url(#chrome)" />
  <rect x="-40" y="118" width="680" height="26" fill="#efe8db" opacity="0.07" transform="rotate(-18 300 300)" />
  <rect x="-40" y="432" width="680" height="14" fill="#ff5a2f" opacity="0.16" transform="rotate(-18 300 300)" />
  <rect width="600" height="600" filter="url(#grain)" opacity="0.55" />

  <circle cx="300" cy="300" r="238" fill="none" stroke="#efe8db" stroke-opacity="0.16" />

  <text x="300" y="272" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="84" fill="#efe8db">Cry For Me</text>
  <line x1="238" y1="302" x2="362" y2="302" stroke="#ff5a2f" stroke-width="2" />
  <text x="300" y="342" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" letter-spacing="5" fill="#9b9487">FEAT. 愛海 · MICHITA</text>

  <text x="300" y="470" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="6" fill="#615c54">LU YU — SIDE A 02</text>
