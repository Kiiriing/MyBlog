      <stop offset="0%" stop-color="#3b3630" />
      <stop offset="48%" stop-color="#171513" />
      <stop offset="100%" stop-color="#080807" />
    </radialGradient>
    <linearGradient id="chrome" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#efe8db" stop-opacity="0" />
      <stop offset="42%" stop-color="#efe8db" stop-opacity="0.26" />
      <stop offset="62%" stop-color="#ff5a2f" stop-opacity="0.28" />
