<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#040615"/>
      <stop offset=".45" stop-color="#0b1035"/>
      <stop offset=".78" stop-color="#201a4f"/>
      <stop offset="1" stop-color="#090a12"/>
    </linearGradient>
    <radialGradient id="moon" cx="42%" cy="38%" r="62%">
      <stop offset="0" stop-color="#f8f2e4"/>
      <stop offset=".6" stop-color="#d9d5de"/>
      <stop offset="1" stop-color="#8d88bd"/>
    </radialGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#4468ff" stop-opacity=".05"/>
      <stop offset=".45" stop-color="#5d71ff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#9b86ff" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8e6a" stop-opacity=".1"/>
      <stop offset=".5" stop-color="#ffbca0" stop-opacity=".65"/>
      <stop offset="1" stop-color="#ff6a4d" stop-opacity=".06"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="blurBig" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="warp" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".004 .01" numOctaves="4" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="150" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#sky)"/>
  <circle cx="770" cy="330" r="190" fill="url(#moon)" opacity=".92"/>
  <circle cx="770" cy="330" r="270" fill="#9c94d4" opacity=".12" filter="url(#blurBig)"/>

  <g filter="url(#blur)">
    <path d="M-100 1050 C 180 880 360 1010 600 930 C 860 840 1010 920 1300 780 L1300 1600 L-100 1600 Z" fill="url(#waveA)" opacity=".8"/>
    <path d="M-100 1180 C 150 1020 420 1180 640 1080 C 900 960 1040 1060 1300 980 L1300 1600 L-100 1600 Z" fill="#283d9d" opacity=".55"/>
    <path d="M-100 1280 C 200 1170 380 1320 660 1230 C 940 1140 1080 1240 1300 1160 L1300 1600 L-100 1600 Z" fill="#0a0c24"/>
  </g>

  <g filter="url(#warp)" fill="none">
    <path d="M-50 1080 C 220 950 420 1090 660 1000 C 900 910 1080 1000 1250 900" stroke="url(#waveA)" stroke-width="2.2"/>
    <path d="M-50 1150 C 230 1010 410 1160 650 1070 C 900 980 1080 1080 1250 970" stroke="url(#waveB)" stroke-width="1.4" opacity=".8"/>
    <path d="M-50 1230 C 250 1110 430 1240 690 1140 C 930 1050 1090 1140 1250 1060" stroke="#737fff" stroke-width="1" opacity=".55"/>
    <path d="M-50 1330 C 230 1230 450 1330 710 1250 C 940 1180 1110 1260 1250 1200" stroke="#b7a8ff" stroke-width=".8" opacity=".4"/>
  </g>

  <g fill="none" stroke="#dcd8ee" opacity=".18">
    <circle cx="770" cy="330" r="230" stroke-width=".8"/>
    <circle cx="770" cy="330" r="300" stroke-width=".6" stroke-dasharray="2 8"/>
  </g>

  <g font-family="'JetBrains Mono', Consolas, monospace" fill="#ece7f6" opacity=".8">
    <text x="72" y="92" font-size="16" letter-spacing="4">TIDAL MEMORY / 潮汐记忆</text>
    <text x="72" y="120" font-size="12" letter-spacing="2" opacity=".55">MOTION &amp; INSTALLATION — 2024</text>
    <text x="1128" y="1420" font-size="12" letter-spacing="3" text-anchor="end">THE SEA REMEMBERS IN LOOPS</text>
  </g>

  <text x="600" y="770" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="120" fill="none" stroke="#e8e2f5" stroke-width=".9" opacity=".5">tide</text>

  <rect width="1200" height="1500" filter="url(#grain)" opacity=".15" style="mix-blend-mode:overlay"/>
</svg>
