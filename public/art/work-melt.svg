<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="85%">
      <stop offset="0" stop-color="#241512"/>
      <stop offset=".55" stop-color="#0d0908"/>
      <stop offset="1" stop-color="#050404"/>
    </radialGradient>
    <radialGradient id="blob" cx="38%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fff4dd"/>
      <stop offset=".28" stop-color="#ffcf9c"/>
      <stop offset=".52" stop-color="#ff7439"/>
      <stop offset=".78" stop-color="#d62c12"/>
      <stop offset="1" stop-color="#5a0f06"/>
    </radialGradient>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b74ff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#2c1d63" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="warp" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.012" numOctaves="3" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="120" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <ellipse cx="930" cy="360" rx="330" ry="330" fill="url(#violet)" filter="url(#soft2)"/>
  <g filter="url(#soft)">
    <ellipse cx="590" cy="660" rx="400" ry="500" fill="url(#blob)" transform="rotate(-16 590 660)"/>
    <ellipse cx="390" cy="850" rx="260" ry="330" fill="#ff6a2e" opacity=".55"/>
    <ellipse cx="800" cy="500" rx="170" ry="230" fill="#ffd9a8" opacity=".6"/>
  </g>
  <g filter="url(#warp)" fill="none" stroke="#ffdcb0" opacity=".5">
    <ellipse cx="600" cy="650" rx="330" ry="430" stroke-width="1.6" transform="rotate(-14 600 650)"/>
    <ellipse cx="600" cy="650" rx="250" ry="350" stroke-width="1" opacity=".6"/>
    <path d="M180 1030 C 360 960 440 1090 600 1035 C 760 980 860 1080 1040 1010" stroke-width="1.2"/>
  </g>

  <g font-family="'JetBrains Mono', Consolas, monospace" fill="#f6e8d6" opacity=".75">
    <text x="72" y="92" font-size="16" letter-spacing="4">STUDY 01 / MATERIAL</text>
    <text x="72" y="120" font-size="12" letter-spacing="2" opacity=".55">SOLSTICE STUDIO — 2025</text>
    <text x="1128" y="1420" font-size="12" letter-spacing="3" text-anchor="end">FORM / HEAT / MEMORY</text>
  </g>

  <text x="600" y="1350" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="330" fill="none" stroke="#ffe2bd" stroke-width="1.1" opacity=".38">melt</text>

  <rect width="1200" height="1500" filter="url(#grain)" opacity=".16" style="mix-blend-mode:overlay"/>
  <rect width="1200" height="1500" fill="url(#bg)" opacity=".14"/>
</svg>
