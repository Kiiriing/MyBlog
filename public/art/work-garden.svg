<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="80%">
      <stop offset="0" stop-color="#11160a"/>
      <stop offset=".68" stop-color="#070906"/>
      <stop offset="1" stop-color="#030403"/>
    </radialGradient>
    <radialGradient id="acid" cx="42%" cy="38%" r="60%">
      <stop offset="0" stop-color="#f6ffd0"/>
      <stop offset=".3" stop-color="#dcff45"/>
      <stop offset=".7" stop-color="#7fa800"/>
      <stop offset="1" stop-color="#263500"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d8ff43" stop-opacity=".55"/>
      <stop offset="1" stop-color="#d8ff43" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="warp" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .01" numOctaves="3" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="80" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <circle cx="600" cy="600" r="500" fill="url(#glow)" opacity=".6" filter="url(#blur)"/>
  <g opacity=".26" stroke="#d8ff43" fill="none">
    <path d="M80 0 V1500 M220 0 V1500 M360 0 V1500 M500 0 V1500 M640 0 V1500 M780 0 V1500 M920 0 V1500 M1060 0 V1500" stroke-width=".7"/>
    <path d="M0 200 H1200 M0 340 H1200 M0 480 H1200 M0 620 H1200 M0 760 H1200 M0 900 H1200 M0 1040 H1200 M0 1180 H1200 M0 1320 H1200" stroke-width=".7"/>
  </g>

  <g filter="url(#warp)">
    <ellipse cx="590" cy="590" rx="330" ry="380" fill="url(#acid)" opacity=".95"/>
    <ellipse cx="450" cy="760" rx="190" ry="240" fill="#b8e32c" opacity=".5"/>
  </g>
  <g filter="url(#blur)" opacity=".55">
    <circle cx="820" cy="390" r="120" fill="#f2ffc6"/>
    <circle cx="380" cy="900" r="160" fill="#8ebd12"/>
  </g>

  <g fill="none" stroke="#e9ffb0" opacity=".55">
    <circle cx="600" cy="600" r="290" stroke-width=".9"/>
    <circle cx="600" cy="600" r="360" stroke-width=".6" stroke-dasharray="3 12"/>
    <circle cx="600" cy="600" r="430" stroke-width=".45" opacity=".5"/>
    <ellipse cx="600" cy="600" rx="520" ry="180" stroke-width=".6" transform="rotate(-28 600 600)"/>
  </g>

  <cross href="#x" x="600" y="600"/>
  <g stroke="#0a0c04" stroke-width="2">
    <path d="M590 600 H610 M600 590 V610"/>
  </g>

  <g font-family="'JetBrains Mono', Consolas, monospace" fill="#e8ffb2" opacity=".78">
    <text x="72" y="92" font-size="16" letter-spacing="4">SIGNAL GARDEN / 信号花园</text>
    <text x="72" y="120" font-size="12" letter-spacing="2" opacity=".55">DIGITAL EXPERIENCE — 2026</text>
    <text x="1128" y="1420" font-size="12" letter-spacing="3" text-anchor="end">GROWING IN LOW LIGHT</text>
  </g>

  <text x="600" y="1350" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="200" fill="none" stroke="#eaffb8" stroke-width="1" opacity=".4">garden</text>

  <rect width="1200" height="1500" filter="url(#grain)" opacity=".16" style="mix-blend-mode:overlay"/>
</svg>
