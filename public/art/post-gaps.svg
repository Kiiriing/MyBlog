<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#17150f"/>
      <stop offset=".65" stop-color="#0a0a09"/>
      <stop offset="1" stop-color="#040404"/>
    </radialGradient>
    <filter id="warp" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency=".004 .012" numOctaves="4" seed="33" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="130" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <g filter="url(#warp)" fill="none" stroke="#efe6d6">
    <circle cx="600" cy="650" r="120" stroke-width="1.4" opacity=".8"/>
    <circle cx="600" cy="650" r="180" stroke-width="1" opacity=".6"/>
    <circle cx="600" cy="650" r="245" stroke-width=".8" opacity=".45"/>
    <circle cx="600" cy="650" r="315" stroke-width=".7" opacity=".3"/>
    <circle cx="600" cy="650" r="395" stroke-width=".6" opacity=".2"/>
    <circle cx="600" cy="650" r="490" stroke-width=".5" opacity=".12"/>
  </g>
  <circle cx="600" cy="650" r="34" fill="#ff5a2f" filter="url(#blur)"/>
  <circle cx="600" cy="650" r="7" fill="#ffe6cd"/>

  <g font-family="'JetBrains Mono', Consolas, monospace" fill="#eee5d7" opacity=".7">
    <text x="72" y="92" font-size="15" letter-spacing="4">FIELD NOTE 01</text>
    <text x="1128" y="1420" font-size="11" letter-spacing="3" text-anchor="end">BREATHING IN THE GAPS / 2026</text>
  </g>

  <text x="600" y="1180" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="118" fill="#f1e8d9" opacity=".85">the quiet part</text>
  <text x="600" y="1230" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="6" fill="#f1e8d9" opacity=".45">KEEP IT SLOW</text>

  <rect width="1200" height="1500" filter="url(#grain)" opacity=".18" style="mix-blend-mode:overlay"/>
</svg>
