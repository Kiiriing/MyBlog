spring:
  application:
    name: luyu-blog-server
  config:
    # 真实数据库账号密码放在 server/application-local.yml（已 gitignore），不进入仓库
    import: optional:file:./application-local.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/myblog}
    username: ${DB_USERNAME:myblog}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

logging:
  file:
    # 从 server/ 目录启动时写入 server/logs/
    # LOG_BASE 可改日志路径前缀（不含扩展名）
    name: ${LOG_BASE:logs/luyu-blog}.log
  logback:
    rollingpolicy:
      # 按日期归档：每天一个文件（luyu-blog.2026-11-10.0.gz），同日超过 20MB 时追加序号
      file-name-pattern: ${LOG_BASE:logs/luyu-blog}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 20MB
      max-history: 30
      total-size-cap: 1GB
  level:
    com.luyu.blog: INFO
    org.hibernate.SQL: WARN

app:
  jwt:
    secret: ${JWT_SECRET:luyu-dev-only-secret-key-please-replace-0123456789}
    # 3 天免密登录
    ttl-hours: ${JWT_TTL_HOURS:72}
  auth:
    # 验证码有效期（分钟）
    code-ttl-minutes: ${AUTH_CODE_TTL_MINUTES:10}
    # 同一邮箱两次发送的最小间隔（秒）
    code-resend-seconds: ${AUTH_CODE_RESEND_SECONDS:60}
    # 同一邮箱每小时最多发送次数
    code-max-per-hour: ${AUTH_CODE_MAX_PER_HOUR:5}
    # 同一 IP 每小时最多发送次数
    code-max-per-ip-hour: ${AUTH_CODE_MAX_PER_IP_HOUR:20}
    # 同一验证码允许的最大错误次数
    code-max-attempts: ${AUTH_CODE_MAX_ATTEMPTS:5}
  seed:
    # 该邮箱注册后自动成为管理员；留空则不指定
    admin-email: ${SEED_ADMIN_EMAIL:}
    # 首次启动时若该管理员不存在则自动创建，留空则跳过
    admin-password: ${SEED_ADMIN_PASSWORD:}
