spring:
  application:
    name: luyu-blog-server
  config:
    # 真实数据库账号密码放在 server/application-local.yml（已 gitignore），不进入仓库
    import: optional:file:./application-local.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/myblog}
    username: ${DB_USERNAME:myblog}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
      connection-timeout: 5000
      leak-detection-threshold: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  jackson:
    default-property-inclusion: non_null
  mail:
    # 163 邮箱：在 application-local.yml 填 MAIL_USERNAME / MAIL_PASSWORD（SMTP 授权码）
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}

logging:
  file:
    # 从 server/ 目录启动时写入 server/logs/
    # LOG_BASE 可改日志路径前缀（不含扩展名）
    name: ${LOG_BASE:logs/luyu-blog}.log
  logback:
    rollingpolicy:
      # 按日期归档：每天一个文件（luyu-blog.2026-11-10.0.gz），同日超过 20MB 时追加序号
      file-name-pattern: ${LOG_BASE:logs/luyu-blog}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 20MB
      max-history: 30
      total-size-cap: 1GB
  level:
    com.luyu.blog: INFO
    org.hibernate.SQL: WARN

app:
  jwt:
    # 必须通过 JWT_SECRET 提供至少 32 字节随机密钥；仓库内不再保留可用默认值。
    # 本地开发请在 server/application-local.yml 中配置 app.jwt.secret。
    secret: ${JWT_SECRET:}
    # 3 天免密登录
    ttl-hours: ${JWT_TTL_HOURS:72}
  network:
    # 仅当请求确实经过可信反向代理（Nginx 等）时才设为 true；
    # 直连部署保持 false，避免客户端伪造 X-Forwarded-For 绕过 IP 绑定与限流。
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
  auth:
    # 登录失败锁定：同一账号 + IP 在窗口期内失败达到上限后拒绝登录
    login-window-minutes: ${AUTH_LOGIN_WINDOW_MINUTES:15}
    login-max-attempts: ${AUTH_LOGIN_MAX_ATTEMPTS:5}
    login-attempt-cleanup-ms: ${AUTH_LOGIN_CLEANUP_MS:86400000}
    # 验证码有效期（分钟）
    code-ttl-minutes: ${AUTH_CODE_TTL_MINUTES:10}
    # 同一邮箱两次发送的最小间隔（秒）
    code-resend-seconds: ${AUTH_CODE_RESEND_SECONDS:60}
    # 同一邮箱每小时最多发送次数
    code-max-per-hour: ${AUTH_CODE_MAX_PER_HOUR:5}
    # 同一 IP 每小时最多发送次数
    code-max-per-ip-hour: ${AUTH_CODE_MAX_PER_IP_HOUR:20}
    # 同一验证码允许的最大错误次数
    code-max-attempts: ${AUTH_CODE_MAX_ATTEMPTS:5}
    # 图片验证码有效期（秒）
    captcha-ttl-seconds: ${AUTH_CAPTCHA_TTL_SECONDS:120}
  mail:
    # 发件人显示名；发件地址使用 spring.mail.username
    from-name: ${MAIL_FROM_NAME:LU YU Blog}
  # 站点地址，用于验证码邮件里的入口链接；留空则只显示文字
  site-url: ${SITE_URL:}
  seed:
    # 该邮箱注册后自动成为管理员；留空则不指定
    admin-email: ${SEED_ADMIN_EMAIL:}
    # 首次启动时若该管理员不存在则自动创建，留空则跳过
    admin-password: ${SEED_ADMIN_PASSWORD:}
