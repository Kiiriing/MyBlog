# ProGuard 混淆配置（Spring Boot）
#
# 只做名称混淆，不裁剪、不优化：Spring 大量依赖注解与反射，shrink 很容易误删
# 只在反射里出现的类，收益小而风险高。
#
# 保留策略：
#   - 启动类：manifest 里的 Start-Class 必须指向它
#   - domain：JPA 实体字段名会隐式映射列名（如 email -> email），重命名会改表结构
#   - web.dto / UserPrincipal：record 组件名就是 JSON 字段名
#   - repo：Spring Data 靠方法名派生查询，重命名会破坏查询解析
# 其余 controller / service / security / config 的类名、方法名全部打散。

-dontshrink
-dontoptimize
-dontnote
-dontwarn **

# 注解、泛型签名、方法参数名都是运行时反射要用的，必须保留
-keepattributes Signature,Exceptions,InnerClasses,EnclosingMethod,Record,MethodParameters,RuntimeVisibleAnnotations,RuntimeInvisibleAnnotations,RuntimeVisibleParameterAnnotations,RuntimeInvisibleParameterAnnotations,AnnotationDefault

-keep public class com.luyu.blog.BlogServerApplication {
    public static void main(java.lang.String[]);
}

-keep class com.luyu.blog.domain.** { *; }
-keep class com.luyu.blog.web.dto.** { *; }
-keep class com.luyu.blog.security.UserPrincipal { *; }
-keep interface com.luyu.blog.repo.** { *; }

# 字段注入的配置值由 Spring 按注解写入，字段名可混淆但字段不能删
-keepclassmembers class * {
    @org.springframework.beans.factory.annotation.Value <fields>;
    @org.springframework.beans.factory.annotation.Autowired <fields>;
    @jakarta.persistence.* <fields>;
}

# @Bean 方法名就是全局 bean 名，混淆后容易撞名，保留
-keepclassmembers class * {
    @org.springframework.context.annotation.Bean <methods>;
}
